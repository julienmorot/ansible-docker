---

- name: Add Docker CE Package signing key
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg 
    state: present

- name: Add Docker CE APT repo
  ansible.builtin.apt_repository:
    repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    state: present

- name: Remove Distribution's docker package
  ansible.builtin.package:
    name:
      - docker.io
    state: absent

- name: Install docker packages 
  ansible.builtin.package:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
      - docker-ce
    state: latest

- name: Enable service Docker
  ansible.builtin.service:
    name: docker
    enabled: yes
    state: started

- name: Add users to docker group
  user:
    name: "{{ item }}"
    groups: docker
    append: yes
  with_items:  "{{ add_docker_users }} "

- name: Remove users from docker group
  user:
    name: "{{ item }}"
    groups: docker
    append: yes
  with_items:  "{{ remove_docker_users }} "
